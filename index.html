<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b6fd1">
  <meta name="description" content="Turtle Race: corra com a tartaruga e aprenda Python turtle!">
  <title>Turtle Race</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Tela inicial -->
  <main id="title-screen" class="screen active">
    <div class="sky">
      <div class="sun"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
      <div class="hills"></div>
    </div>

    <!-- Códigos flutuando ao fundo -->
    <div class="floating-code" aria-hidden="true">
      <span style="--x:44%;--y:5%;--d:0s">forward(100)</span>
      <span style="--x:60%;--y:17%;--d:2.3s">left(90)</span>
      <span style="--x:47%;--y:27%;--d:4.6s">color("red")</span>
    </div>

    <div class="road">
      <div class="road-lines"></div>
    </div>

    <div class="title-layout">
      <header class="logo">
        <h1><span class="t1">Turtle</span> <span class="t2">Race</span></h1>
        <p class="subtitle">Corra, desvie e aprenda <code>Python turtle</code>!</p>
      </header>

      <div class="hero">
        <div class="speed-lines" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <img src="assets/turtle-kart.png" alt="Tartaruga piloto no kart vermelho número 1" class="hero-kart" draggable="false">
        <div class="dust" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>

      <nav class="menu">
        <button class="btn btn-race" data-action="race">
          <span class="btn-icon">🏁</span>
          <span class="btn-text"><b>Corrida</b><small>Dê voltas e responda!</small></span>
        </button>
        <button class="btn btn-train" data-action="train">
          <span class="btn-icon">📚</span>
          <span class="btn-text"><b>Treino</b><small>Pratique sem pressa</small></span>
        </button>
      </nav>
    </div>

    <button id="sound-toggle" class="icon-btn" aria-label="Som ligado" title="Som">🔊</button>
  </main>

  <!-- Aviso temporário para partes ainda não feitas -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Dica para girar o celular -->
  <div id="rotate-hint" aria-hidden="true">
    <div class="phone">📱</div>
    <p>Gire o celular para jogar deitado!</p>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
